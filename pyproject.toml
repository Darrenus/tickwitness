[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tickwitness"
version = "0.0.1.dev0"
description = "Research evidence and constrained counterexamples for quantitative workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TickWitness contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
nautilus = ["nautilus-trader==1.231.0"]

[project.urls]
Repository = "https://github.com/Darrenus/tickwitness"
Issues = "https://github.com/Darrenus/tickwitness/issues"

[project.scripts]
tickwitness = "tickwitness.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tickwitness"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[tool.uv]
required-version = ">=0.12.13,<0.13"
