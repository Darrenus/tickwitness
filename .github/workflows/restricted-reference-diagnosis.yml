name: Restricted reference diagnosis

on:
  push:
    branches: [codex/sprint-13-reference-diagnostics]

permissions:
  contents: read

concurrency:
  group: restricted-reference-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restricted-reference-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the actual candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected namespace tool before qualification
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Prepare the explicitly frozen userns authorization
        timeout-minutes: 1
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS,ImageVersion,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          /usr/bin/python3 -I scripts/prepare_reference_policy.py
      - name: Freeze the actual host tuple and qualify bounded controls
        timeout-minutes: 12
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS,ImageVersion,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          /usr/bin/python3 -I scripts/qualify_restricted_reference.py
          --evidence-dir /tmp/tickwitness-reference-evidence
      - name: Capture bounded kernel refusal evidence without changing policy
        if: always()
        timeout-minutes: 1
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT
          /usr/bin/python3 -I scripts/diagnose_restricted_reference.py
          --evidence-dir /tmp/tickwitness-reference-evidence
      - name: Preserve sanitized actual reference evidence on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restricted-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/tickwitness-reference-evidence
            /tmp/tickwitness-reference-policy-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  reference-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - if: always()
        run: make format
      - if: always()
        run: make type
      - if: always()
        run: make docs
      - name: Verify data-only refusal and observation regressions
        run: >-
          uv run --locked pytest -q
          tests/infrastructure/test_restricted_reference.py
          tests/test_restricted_reference_qualification.py
          tests/test_restricted_reference_diagnostics.py
          tests/test_reference_policy.py
      - name: Prepare remote formatting corrections
        if: failure()
        run: |
          uv run --locked ruff check --fix src tests scripts || true
          uv run --locked ruff format src tests scripts
          git diff --binary > /tmp/tickwitness-reference-quality.patch
      - name: Preserve remote formatting corrections
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-quality-corrections-${{ github.sha }}
          path: /tmp/tickwitness-reference-quality.patch
          if-no-files-found: ignore
          retention-days: 30
