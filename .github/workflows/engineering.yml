name: Engineering

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - if: always()
        run: make format
      - if: always()
        run: make type
      - if: always()
        run: make docs
      - name: Prepare formatting corrections after a quality failure
        if: failure()
        run: |
          uv run --locked ruff check --fix src tests scripts || true
          uv run --locked ruff format src tests scripts
          git diff --binary > /tmp/tickwitness-quality.patch
      - name: Preserve formatting corrections for review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-corrections-${{ github.sha }}
          path: /tmp/tickwitness-quality.patch
          if-no-files-found: ignore
          retention-days: 7

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: make test

  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: make build
      - name: Verify installed data and protocol workflows outside the source directory
        run: |
          uv venv /tmp/tickwitness-wheel --python 3.12
          uv pip install --python /tmp/tickwitness-wheel/bin/python --no-index --no-deps dist/*.whl
          python3 scripts/smoke_distribution.py --python /tmp/tickwitness-wheel/bin/python
          python3 scripts/smoke_evidence.py --python /tmp/tickwitness-wheel/bin/python
          python3 scripts/smoke_scenarios.py --python /tmp/tickwitness-wheel/bin/python
          python3 scripts/smoke_search_plans.py --python /tmp/tickwitness-wheel/bin/python --report /tmp/search-plans-core.json
          python3 scripts/smoke_search_execution.py --python /tmp/tickwitness-wheel/bin/python --report /tmp/search-execution-core.json --records-dir /tmp/search-execution-core-records
          python3 scripts/smoke_campaign_budgets.py --python /tmp/tickwitness-wheel/bin/python --report /tmp/campaign-budgets-core.json --records-dir /tmp/campaign-budgets-core-records
          python3 scripts/smoke_search_findings.py --python /tmp/tickwitness-wheel/bin/python --budget-report /tmp/campaign-budgets-core.json --budget-records /tmp/campaign-budgets-core-records --report /tmp/search-findings-core.json --records-dir /tmp/search-findings-core-records
          python3 scripts/smoke_search_evidence.py --python /tmp/tickwitness-wheel/bin/python --finding-report /tmp/search-findings-core.json --finding-records /tmp/search-findings-core-records --report /tmp/search-evidence-core.json --bundles-dir /tmp/search-evidence-core-bundles
          python3 scripts/smoke_queue_constraints.py --python /tmp/tickwitness-wheel/bin/python
          python3 scripts/smoke_queue_execution.py --python /tmp/tickwitness-wheel/bin/python
          python3 scripts/smoke_tagged_queue.py --python /tmp/tickwitness-wheel/bin/python --report /tmp/tagged-queue-core.json
          python3 scripts/smoke_tagged_evidence.py --python /tmp/tickwitness-wheel/bin/python --verifier-python /tmp/tickwitness-wheel/bin/python --core-only --report /tmp/tagged-pair-core.json --bundles-dir /tmp/tagged-pair-core-bundles
          python3 scripts/smoke_tagged_findings.py --python /tmp/tickwitness-wheel/bin/python --verifier-python /tmp/tickwitness-wheel/bin/python --pairs-dir /tmp/tagged-pair-core-bundles --source-report /tmp/tagged-pair-core.json --report /tmp/tagged-findings-core.json --bundles-dir /tmp/tagged-findings-core-bundles
      - name: Preserve portable installed-core search evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-evidence-core-${{ github.sha }}
          path: |
            /tmp/search-evidence-core.json
            /tmp/search-evidence-core-bundles
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core scoped search conclusions and local evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-findings-core-${{ github.sha }}
          path: |
            /tmp/search-findings-core.json
            /tmp/search-findings-core-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core campaign resource stops and original budget links
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campaign-budgets-core-${{ github.sha }}
          path: |
            /tmp/campaign-budgets-core.json
            /tmp/campaign-budgets-core-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core search failure and persistent candidate associations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-execution-core-${{ github.sha }}
          path: |
            /tmp/search-execution-core.json
            /tmp/search-execution-core-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core deterministic candidate planning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-plans-core-${{ github.sha }}
          path: /tmp/search-plans-core.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core frozen authority and finding evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-findings-core-${{ github.sha }}
          path: |
            /tmp/tagged-findings-core.json
            /tmp/tagged-findings-core-bundles
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core tagged missing-extra and budget evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-queue-core-${{ github.sha }}
          path: /tmp/tagged-queue-core.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-core recorded tagged pair verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-pair-core-${{ github.sha }}
          path: |
            /tmp/tagged-pair-core.json
            /tmp/tagged-pair-core-bundles
          if-no-files-found: ignore
          retention-days: 30
      - name: Install wheel in a separate environment and working directory
        run: |
          cd /tmp
          /tmp/tickwitness-wheel/bin/tickwitness --version
          /tmp/tickwitness-wheel/bin/python -m tickwitness --help
          /tmp/tickwitness-wheel/bin/python -c "from tickwitness.domain.replay.capabilities import EngineCapabilities"

  native-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra nautilus
      - name: Qualify step-coupled receive clocks before scenario execution
        run: uv run --locked --extra nautilus python -I scripts/qualify_scenario_clocks.py --output /tmp/scenario-clock-qualification.json
      - name: Preserve clock hypotheses and observed native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-clocks-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/scenario-clock-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Qualify public queue-model extensions on fixed synthetic observations
        run: uv run --locked --extra nautilus python -I scripts/qualify_queue_models.py --output /tmp/queue-model-qualification.json
      - name: Preserve queue allocation and native execution qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-models-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/queue-model-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Qualify observation projections and diagnostic predicate semantics
        run: uv run --locked --extra nautilus python -I scripts/qualify_queue_semantics.py --output /tmp/queue-semantics-qualification.json
      - name: Preserve semantic qualification and known truth-table oracles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-semantics-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/queue-semantics-qualification.json
          if-no-files-found: error
          retention-days: 30
      - run: uv run --locked --extra nautilus pytest
      - name: Build and replace editable package with wheel
        run: |
          uv build --no-build-isolation
          uv pip install --python .venv/bin/python --no-index --no-deps --reinstall dist/*.whl
      - name: Verify installed native replay through supervised CLI
        run: |
          python3 scripts/smoke_distribution.py --python .venv/bin/python --native
          python3 scripts/smoke_evidence.py --python .venv/bin/python --native
          python3 scripts/smoke_scenarios.py --python .venv/bin/python --native --report /tmp/scenario-execution.json
          python3 scripts/smoke_queue_constraints.py --python .venv/bin/python
          python3 scripts/smoke_queue_execution.py --python .venv/bin/python --native --report /tmp/queue-execution.json
          python3 scripts/smoke_tagged_queue.py --python .venv/bin/python --native --report /tmp/tagged-queue-execution.json
          .venv/bin/python -I scripts/qualify_queue_models.py --output /tmp/queue-wheel-qualification.json
          .venv/bin/python -I scripts/qualify_queue_semantics.py --output /tmp/queue-semantics-wheel.json
      - name: Verify relocated tagged pair bundles using an installed core-only wheel
        run: |
          uv venv /tmp/tickwitness-tagged-verifier --python 3.12
          uv pip install --python /tmp/tickwitness-tagged-verifier/bin/python --no-index --no-deps dist/*.whl
          python3 scripts/smoke_tagged_evidence.py --python .venv/bin/python --verifier-python /tmp/tickwitness-tagged-verifier/bin/python --report /tmp/tagged-pair-evidence.json --bundles-dir /tmp/tagged-pair-evidence-bundles
      - name: Issue scoped findings and verify them in a core-only environment
        run: |
          python3 scripts/smoke_tagged_findings.py --python /tmp/tickwitness-tagged-verifier/bin/python --verifier-python /tmp/tickwitness-tagged-verifier/bin/python --pairs-dir /tmp/tagged-pair-evidence-bundles --source-report /tmp/tagged-pair-evidence.json --report /tmp/tagged-findings.json --bundles-dir /tmp/tagged-findings-bundles
      - name: Verify installed sequential search with the original shared attempt budget
        run: |
          python3 scripts/smoke_search_execution.py --python .venv/bin/python --verifier-python /tmp/tickwitness-tagged-verifier/bin/python --native --report /tmp/search-execution.json --records-dir /tmp/search-execution-records
      - name: Verify supervised campaign time and storage admission limits
        run: |
          python3 scripts/smoke_campaign_budgets.py --python .venv/bin/python --verifier-python /tmp/tickwitness-tagged-verifier/bin/python --native --report /tmp/campaign-budgets.json --records-dir /tmp/campaign-budgets-records
      - name: Verify scoped search conclusions without consuming more attempts
        run: |
          python3 scripts/smoke_search_findings.py --python .venv/bin/python --verifier-python /tmp/tickwitness-tagged-verifier/bin/python --native --budget-report /tmp/campaign-budgets.json --budget-records /tmp/campaign-budgets-records --report /tmp/search-findings.json --records-dir /tmp/search-findings-records
      - name: Export relocated search evidence and verify it without original stores
        run: |
          python3 scripts/smoke_search_evidence.py --python /tmp/tickwitness-tagged-verifier/bin/python --finding-report /tmp/search-findings.json --finding-records /tmp/search-findings-records --report /tmp/search-evidence.json --bundles-dir /tmp/search-evidence-bundles
      - name: Preserve portable search evidence and offline verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/search-evidence.json
            /tmp/search-evidence-bundles
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve local search conclusions and read-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-findings-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/search-findings.json
            /tmp/search-findings-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve supervised resource budgets and core-only inspection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campaign-budgets-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/campaign-budgets.json
            /tmp/campaign-budgets-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve candidate dispatch, original ledger and core-only search inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-execution-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/search-execution.json
            /tmp/search-execution-records
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve frozen finding authority and final content evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-findings-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/tagged-findings.json
            /tmp/tagged-findings-bundles
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve portable tagged pair bundles and offline verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-pair-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            /tmp/tagged-pair-evidence.json
            /tmp/tagged-pair-evidence-bundles
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-wheel semantic qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-semantics-wheel-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/queue-semantics-wheel.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-wheel tagged conserved execution and horizon evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagged-queue-execution-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/tagged-queue-execution.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-wheel persistent queue execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-execution-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/queue-execution.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-wheel native queue qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-wheel-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/queue-wheel-qualification.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve installed-wheel scenario execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-execution-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/scenario-execution.json
          if-no-files-found: ignore
          retention-days: 30

  preview-artifacts:
    needs: [quality, tests, distribution, native-replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: make build
      - name: Validate candidate metadata, source examples and checksums
        run: python3 scripts/prepare_preview.py
      - name: Qualify the actual wheel using examples from the actual source archive
        run: |
          mkdir /tmp/tickwitness-preview-source
          tar -xzf dist/tickwitness-*.tar.gz -C /tmp/tickwitness-preview-source
          TW_SOURCE=$(find /tmp/tickwitness-preview-source -mindepth 1 -maxdepth 1 -type d)
          test -f "$TW_SOURCE/Makefile"
          python3 "$TW_SOURCE/scripts/check_docs.py"
          uv venv /tmp/tickwitness-preview-core --python 3.12
          uv pip install --python /tmp/tickwitness-preview-core/bin/python --no-index --no-deps dist/*.whl
          python3 "$TW_SOURCE/scripts/smoke_distribution.py" --python /tmp/tickwitness-preview-core/bin/python
          python3 "$TW_SOURCE/scripts/smoke_evidence.py" --python /tmp/tickwitness-preview-core/bin/python
          python3 "$TW_SOURCE/scripts/smoke_scenarios.py" --python /tmp/tickwitness-preview-core/bin/python
          python3 "$TW_SOURCE/scripts/smoke_search_plans.py" --python /tmp/tickwitness-preview-core/bin/python --report /tmp/search-plans-source-wheel.json
          python3 "$TW_SOURCE/scripts/smoke_search_execution.py" --python /tmp/tickwitness-preview-core/bin/python --report /tmp/search-execution-source-wheel-core.json --records-dir /tmp/search-execution-source-wheel-core-records
          python3 "$TW_SOURCE/scripts/smoke_campaign_budgets.py" --python /tmp/tickwitness-preview-core/bin/python --report /tmp/campaign-budgets-source-wheel-core.json --records-dir /tmp/campaign-budgets-source-wheel-core-records
          python3 "$TW_SOURCE/scripts/smoke_search_findings.py" --python /tmp/tickwitness-preview-core/bin/python --budget-report /tmp/campaign-budgets-source-wheel-core.json --budget-records /tmp/campaign-budgets-source-wheel-core-records --report /tmp/search-findings-source-wheel-core.json --records-dir /tmp/search-findings-source-wheel-core-records
          python3 "$TW_SOURCE/scripts/smoke_search_evidence.py" --python /tmp/tickwitness-preview-core/bin/python --finding-report /tmp/search-findings-source-wheel-core.json --finding-records /tmp/search-findings-source-wheel-core-records --report /tmp/search-evidence-source-wheel-core.json --bundles-dir /tmp/search-evidence-source-wheel-core-bundles
          python3 "$TW_SOURCE/scripts/smoke_queue_constraints.py" --python /tmp/tickwitness-preview-core/bin/python
          python3 "$TW_SOURCE/scripts/smoke_queue_execution.py" --python /tmp/tickwitness-preview-core/bin/python
          python3 "$TW_SOURCE/scripts/smoke_tagged_queue.py" --python /tmp/tickwitness-preview-core/bin/python --report /tmp/tagged-queue-source-wheel-core.json
          python3 "$TW_SOURCE/scripts/smoke_tagged_evidence.py" --python /tmp/tickwitness-preview-core/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --core-only --report /tmp/tagged-pair-source-wheel-core.json --bundles-dir /tmp/tagged-pair-source-wheel-core-bundles
          python3 "$TW_SOURCE/scripts/smoke_tagged_findings.py" --python /tmp/tickwitness-preview-core/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --pairs-dir /tmp/tagged-pair-source-wheel-core-bundles --source-report /tmp/tagged-pair-source-wheel-core.json --report /tmp/tagged-findings-source-wheel-core.json --bundles-dir /tmp/tagged-findings-source-wheel-core-bundles
          uv venv /tmp/tickwitness-preview-native --python 3.12
          uv pip install --python /tmp/tickwitness-preview-native/bin/python --only-binary nautilus-trader --no-deps dist/*.whl
          uv export --locked --extra nautilus --no-dev --no-emit-project --format requirements-txt --output-file /tmp/tickwitness-preview-native-requirements.txt
          uv pip install --python /tmp/tickwitness-preview-native/bin/python --only-binary nautilus-trader --require-hashes -r /tmp/tickwitness-preview-native-requirements.txt
          python3 "$TW_SOURCE/scripts/smoke_distribution.py" --python /tmp/tickwitness-preview-native/bin/python --native
          python3 "$TW_SOURCE/scripts/smoke_evidence.py" --python /tmp/tickwitness-preview-native/bin/python --native
          python3 "$TW_SOURCE/scripts/smoke_scenarios.py" --python /tmp/tickwitness-preview-native/bin/python --native
          python3 "$TW_SOURCE/scripts/smoke_search_execution.py" --python /tmp/tickwitness-preview-native/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --native --report /tmp/search-execution-source-wheel.json --records-dir /tmp/search-execution-source-wheel-records
          python3 "$TW_SOURCE/scripts/smoke_campaign_budgets.py" --python /tmp/tickwitness-preview-native/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --native --report /tmp/campaign-budgets-source-wheel.json --records-dir /tmp/campaign-budgets-source-wheel-records
          python3 "$TW_SOURCE/scripts/smoke_search_findings.py" --python /tmp/tickwitness-preview-native/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --native --budget-report /tmp/campaign-budgets-source-wheel.json --budget-records /tmp/campaign-budgets-source-wheel-records --report /tmp/search-findings-source-wheel.json --records-dir /tmp/search-findings-source-wheel-records
          python3 "$TW_SOURCE/scripts/smoke_search_evidence.py" --python /tmp/tickwitness-preview-core/bin/python --finding-report /tmp/search-findings-source-wheel.json --finding-records /tmp/search-findings-source-wheel-records --report /tmp/search-evidence-source-wheel.json --bundles-dir /tmp/search-evidence-source-wheel-bundles
          python3 "$TW_SOURCE/scripts/smoke_queue_constraints.py" --python /tmp/tickwitness-preview-native/bin/python
          python3 "$TW_SOURCE/scripts/smoke_queue_execution.py" --python /tmp/tickwitness-preview-native/bin/python --native --report /tmp/queue-source-wheel-execution.json
          python3 "$TW_SOURCE/scripts/smoke_tagged_queue.py" --python /tmp/tickwitness-preview-native/bin/python --native --report /tmp/tagged-queue-source-wheel-execution.json
          python3 "$TW_SOURCE/scripts/smoke_tagged_evidence.py" --python /tmp/tickwitness-preview-native/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --report /tmp/tagged-pair-source-wheel-evidence.json --bundles-dir /tmp/tagged-pair-source-wheel-bundles
          python3 "$TW_SOURCE/scripts/smoke_tagged_findings.py" --python /tmp/tickwitness-preview-core/bin/python --verifier-python /tmp/tickwitness-preview-core/bin/python --pairs-dir /tmp/tagged-pair-source-wheel-bundles --source-report /tmp/tagged-pair-source-wheel-evidence.json --report /tmp/tagged-findings-source-wheel.json --bundles-dir /tmp/tagged-findings-source-wheel-bundles
          /tmp/tickwitness-preview-native/bin/python -I "$TW_SOURCE/scripts/qualify_queue_models.py" --output /tmp/queue-source-wheel-qualification.json
          /tmp/tickwitness-preview-native/bin/python -I "$TW_SOURCE/scripts/qualify_queue_semantics.py" --output /tmp/queue-semantics-source-wheel.json
          cd dist
          sha256sum --check SHA256SUMS
      - name: Preserve portable search evidence from actual source archive and installed wheels
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
