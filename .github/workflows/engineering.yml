  engineering:
    if: always()
    needs: [quality, tests, distribution, native-replay, preview-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every engineering job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          DISTRIBUTION: ${{ needs.distribution.result }}
          NATIVE_REPLAY: ${{ needs.native-replay.result }}
          PREVIEW_ARTIFACTS: ${{ needs.preview-artifacts.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$DISTRIBUTION" = success
          test "$NATIVE_REPLAY" = success
          test "$PREVIEW_ARTIFACTS" = success
